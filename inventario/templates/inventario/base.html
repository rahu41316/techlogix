<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}TechLogix S.A.{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="{% url 'index' %}">TechLogix S.A.</a>
  <div class="d-flex gap-2 align-items-center">
    <a class="btn btn-outline-light btn-sm" href="{% url 'catalogo' %}">Catálogo</a>
    {% if user.is_authenticated %}
      <a class="btn btn-outline-light btn-sm" href="{% url 'admin_panel' %}">Panel</a>
      <form method="post" action="{% url 'logout' %}" class="m-0">
        {% csrf_token %}
        <button class="btn btn-warning btn-sm">Salir ({{ user.username }})</button>
      </form>
    {% else %}
      <a class="btn btn-warning btn-sm" href="{% url 'login' %}">Área restringida</a>
    {% endif %}
  </div>
</nav>
<main class="container my-4">{% block content %}{% endblock %}</main>
</body>
</html>
