{% extends 'inventario/base.html' %}
{% block content %}
<h2>Catálogo de productos</h2>
<form method="get" class="row g-2 mb-3">
  <div class="col-md-5"><input name="q" value="{{ q }}" class="form-control" placeholder="Buscar por nombre"></div>
  <div class="col-md-4">
    <select name="categoria" class="form-select">
      <option value="">Todas las categorías</option>
      {% for c in categorias %}
        <option value="{{ c.id }}" {% if cat_sel == c.id|stringformat:"s" %}selected{% endif %}>{{ c.nombre }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3"><button class="btn btn-primary w-100">Filtrar</button></div>
</form>
<table class="table table-striped">
  <tr><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th></tr>
  {% for p in productos %}
    <tr><td>{{ p.nombre }}</td><td>{{ p.categoria }}</td><td>${{ p.precio }}</td><td>{{ p.stock }}</td></tr>
  {% empty %}
    <tr><td colspan="4">No hay productos que coincidan.</td></tr>
  {% endfor %}
</table>
{% endblock %}
