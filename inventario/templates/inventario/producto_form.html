{% extends 'inventario/base.html' %}
{% block content %}
<h2>{% if object %}Editar{% else %}Nuevo{% endif %} producto</h2>
<form method="post" class="col-md-6">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Guardar</button>
  <a class="btn btn-secondary" href="{% url 'admin_panel' %}">Cancelar</a>
</form>
{% endblock %}
